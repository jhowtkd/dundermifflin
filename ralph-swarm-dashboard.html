<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph Swarm Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
        }
        
        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header h1 span {
            font-size: 28px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #7d8590;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        
        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7d8590;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #7d8590;
            margin-top: 5px;
        }
        
        .activity-list {
            space-y: 12px;
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .icon-find { background: #388bfd33; }
        .icon-build { background: #3fb95033; }
        .icon-create { background: #a371f733; }
        .icon-track { background: #d2992233; }
        .icon-watch { background: #f8514933; }
        
        .activity-info {
            flex: 1;
        }
        
        .activity-agent {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        
        .activity-task {
            font-size: 12px;
            color: #7d8590;
            margin-top: 2px;
        }
        
        .activity-bar {
            width: 100px;
            height: 4px;
            background: #30363d;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .activity-progress {
            height: 100%;
            background: #3fb950;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .live-feed {
            margin-top: 20px;
        }
        
        .feed-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #21262d;
        }
        
        .feed-time {
            font-size: 12px;
            color: #7d8590;
            min-width: 50px;
        }
        
        .feed-content {
            flex: 1;
        }
        
        .feed-agent {
            font-size: 12px;
            font-weight: 600;
            color: #58a6ff;
        }
        
        .feed-action {
            font-size: 13px;
            color: #c9d1d9;
            margin-top: 2px;
        }
        
        .channels-section {
            margin-top: 30px;
        }
        
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .channel-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        
        .channel-card:hover {
            border-color: #58a6ff;
        }
        
        .channel-name {
            font-size: 13px;
            color: #7d8590;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .channel-name::before {
            content: '#';
            color: #484f58;
        }
        
        .channel-messages {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-top: 8px;
        }
        
        .pending-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #f85149;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>🐝</span> Ralph Swarm Dashboard</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span>Live</span>
        </div>
    </div>
    
    <div class="grid">
        <div class="card">
            <h2>📊 Today's Summary</h2>
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-number" id="tasks-count">0</div>
                    <div class="stat-label">tasks</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="threads-count">0</div>
                    <div class="stat-label">threads</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="snippets-count">0</div>
                    <div class="stat-label">snippets</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>🤖 Agent Activity</h2>
            <div class="activity-list" id="activity-list">
                <!-- Activity items will be inserted here -->
            </div>
            <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 12px; color: #7d8590;">Pending queue</span>
                <span class="pending-badge" id="pending-count">0</span>
            </div>
        </div>
    </div>
    
    <div class="card full-width">
        <h2>📡 Live Feed</h2>
        <div class="live-feed" id="live-feed">
            <!-- Feed items will be inserted here -->
        </div>
    </div>
    
    <div class="channels-section">
        <h2 style="font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #7d8590; margin-bottom: 15px;">Channels</h2>
        <div class="channel-grid">
            <div class="channel-card">
                <div class="channel-name">orders</div>
                <div class="channel-messages" id="orders-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">agent-chat</div>
                <div class="channel-messages" id="chat-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">find-output</div>
                <div class="channel-messages" id="find-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">build-output</div>
                <div class="channel-messages" id="build-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">create-output</div>
                <div class="channel-messages" id="create-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">logs</div>
                <div class="channel-messages" id="logs-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">memory</div>
                <div class="channel-messages" id="memory-count">0</div>
            </div>
            <div class="channel-card">
                <div class="channel-name">drop-links</div>
                <div class="channel-messages" id="links-count">0</div>
            </div>
        </div>
    </div>
    
    <script>
        // Simulated data - in production, this would come from the API
        const agents = [
            { name: 'Scout', role: 'find', task: 'Researching competitors', progress: 75 },
            { name: 'Max', role: 'build', task: 'Building landing page', progress: 60 },
            { name: 'Maya', role: 'create', task: 'Writing copy', progress: 90 },
            { name: 'Tracker', role: 'track', task: 'Monitoring metrics', progress: 100 },
            { name: 'Watcher', role: 'watch', task: 'Observing trends', progress: 45 }
        ];
        
        const liveFeed = [
            { time: '2:34 PM', agent: 'Find', action: 'Researching competitors - scanning 12 sources' },
            { time: '2:32 PM', agent: 'Create', action: 'Writing comparison docs - draft 2 of 3' },
            { time: '2:28 PM', agent: 'Build', action: 'Deployed pricing page to staging' },
            { time: '2:25 PM', agent: 'Track', action: 'Updated competitor pricing tracker' },
            { time: '2:21 PM', agent: 'Find', action: 'Completed AI tools research - 15 found' },
            { time: '2:18 PM', agent: 'Watch', action: 'Detected 3 new tool launches' },
            { time: '2:15 PM', agent: 'Build', action: 'Started landing page scaffold' },
            { time: '2:12 PM', agent: 'Create', action: 'Thread written - comparison of top 8 tools' }
        ];
        
        // Render agent activity
        function renderActivity() {
            const list = document.getElementById('activity-list');
            list.innerHTML = agents.map(agent => `
                <div class="activity-item">
                    <div class="activity-icon icon-${agent.role}">${getIcon(agent.role)}</div>
                    <div class="activity-info">
                        <div class="activity-agent">${agent.name}</div>
                        <div class="activity-task">${agent.task}</div>
                    </div>
                    <div class="activity-bar">
                        <div class="activity-progress" style="width: ${agent.progress}%"></div>
                    </div>
                </div>
            `).join('');
        }
        
        function getIcon(role) {
            const icons = {
                find: '🔍',
                build: '🛠️',
                create: '📝',
                track: '📊',
                watch: '👁️'
            };
            return icons[role] || '🤖';
        }
        
        // Render live feed
        function renderLiveFeed() {
            const feed = document.getElementById('live-feed');
            feed.innerHTML = liveFeed.map(item => `
                <div class="feed-item">
                    <div class="feed-time">${item.time}</div>
                    <div class="feed-content">
                        <div class="feed-agent">${item.agent}</div>
                        <div class="feed-action">${item.action}</div>
                    </div>
                </div>
            `).join('');
        }
        
        // Update stats with animation
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            const range = end - start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));
            let current = start;
            
            const timer = setInterval(() => {
                current += increment;
                obj.textContent = current;
                if (current == end) {
                    clearInterval(timer);
                }
            }, stepTime);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderActivity();
            renderLiveFeed();
            
            // Animate stats
            animateValue('tasks-count', 0, 3, 500);
            animateValue('threads-count', 0, 1, 500);
            animateValue('snippets-count', 0, 2, 500);
            animateValue('pending-count', 0, 0, 300);
            
            // Channel counts
            animateValue('orders-count', 0, 5, 300);
            animateValue('chat-count', 0, 12, 300);
            animateValue('find-count', 0, 8, 300);
            animateValue('build-count', 0, 6, 300);
            animateValue('create-count', 0, 4, 300);
            animateValue('logs-count', 0, 15, 300);
            animateValue('memory-count', 0, 3, 300);
            animateValue('links-count', 0, 2, 300);
        });
        
        // Auto-refresh every 30 seconds
        setInterval(() => {
            // In production, fetch new data from API
            console.log('Refreshing dashboard...');
        }, 30000);
    </script>
</body>
</html>
