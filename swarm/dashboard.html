<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph Swarm Dashboard v5.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #7d8590;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header h1 span {
            font-size: 24px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        
        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .stat {
            text-align: center;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Activity */
        .activity-list {
            space-y: 12px;
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        
        .activity-item:hover {
            background: var(--border-color);
        }
        
        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .icon-find { background: rgba(88, 166, 255, 0.2); }
        .icon-build { background: rgba(63, 185, 80, 0.2); }
        .icon-create { background: rgba(163, 113, 247, 0.2); }
        .icon-track { background: rgba(210, 153, 34, 0.2); }
        .icon-watch { background: rgba(248, 81, 73, 0.2); }
        
        .activity-info {
            flex: 1;
        }
        
        .activity-agent {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .activity-task {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        .activity-bar {
            width: 80px;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .activity-progress {
            height: 100%;
            background: var(--accent-green);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        /* Live Feed */
        .live-feed {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .feed-item {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .feed-time {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 50px;
            font-family: monospace;
        }
        
        .feed-content {
            flex: 1;
        }
        
        .feed-channel {
            font-size: 11px;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .feed-message {
            font-size: 13px;
            color: var(--text-primary);
            margin-top: 2px;
            line-height: 1.4;
        }
        
        /* Channels */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        .channel-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .channel-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }
        
        .channel-card.active {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.1);
        }
        
        .channel-name {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .channel-name::before {
            content: '#';
            color: var(--text-secondary);
        }
        
        .channel-messages {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 6px;
        }
        
        .channel-preview {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Task Creator */
        .task-creator {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .task-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        
        .task-input:focus {
            border-color: var(--accent-blue);
        }
        
        .task-input::placeholder {
            color: var(--text-secondary);
        }
        
        .btn {
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Messages View */
        .messages-view {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .message-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .message-content {
            flex: 1;
        }
        
        .message-header {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .message-author {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .message-text {
            font-size: 13px;
            color: var(--text-primary);
            margin-top: 4px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        
        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .channels-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>🐝</span> Ralph Swarm Dashboard</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span id="connection-status">Live</span>
        </div>
    </div>
    
    <div class="container">
        <!-- Task Creator -->
        <div class="card" style="margin-bottom: 20px;">
            <h2>📝 Nova Tarefa</h2>
            <div class="task-creator">
                <input type="text" 
                       class="task-input" 
                       id="task-input"
                       placeholder="Digite sua tarefa (ex: Research concorrentes e criar landing page)..."
                       onkeypress="if(event.key==='Enter') createTask()">
                <button class="btn" onclick="createTask()">Executar</button>
            </div>
        </div>
        
        <!-- Stats & Activity -->
        <div class="grid">
            <div class="card">
                <h2>📊 Today's Summary</h2>
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-number" id="tasks-count">-</div>
                        <div class="stat-label">tasks</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="completed-count">-</div>
                        <div class="stat-label">completed</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="agents-count">-</div>
                        <div class="stat-label">agents</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>🤖 Agent Activity</h2>
                <div class="activity-list" id="activity-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading...
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Live Feed -->
        <div class="card" style="margin-bottom: 20px;">
            <h2>📡 Live Feed</h2>
            <div class="live-feed" id="live-feed">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading...
                </div>
            </div>
        </div>
        
        <!-- Channels -->
        <div class="card" style="margin-bottom: 20px;">
            <h2>📺 Channels</h2>
            <div class="channels-grid" id="channels-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading...
                </div>
            </div>
        </div>
        
        <!-- Messages -->
        <div class="card">
            <h2>💬 Messages <span id="current-channel" style="color: var(--text-secondary);">#orders</span></h2>
            <div class="messages-view" id="messages-view">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Config
        const API_BASE = '/api/swarm';
        let currentChannel = 'orders';
        let refreshInterval;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            loadChannels();
            loadMessages(currentChannel);
            startAutoRefresh();
        });
        
        // Load dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_BASE}/dashboard`);
                const data = await response.json();
                
                // Update stats
                document.getElementById('tasks-count').textContent = data.today.tasks || 0;
                document.getElementById('completed-count').textContent = data.today.completed || 0;
                document.getElementById('agents-count').textContent = data.agents.total || 0;
                
                // Update activity
                updateActivity(data.agents);
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        // Update activity list
        function updateActivity(agentsData) {
            const container = document.getElementById('activity-list');
            
            const agents = [
                { name: 'Scout', role: 'find', emoji: '🔍', status: 'idle' },
                { name: 'Max', role: 'build', emoji: '🛠️', status: 'idle' },
                { name: 'Maya', role: 'create', emoji: '📝', status: 'idle' },
                { name: 'Tracker', role: 'track', emoji: '📊', status: 'idle' },
                { name: 'Watcher', role: 'watch', emoji: '👁️', status: 'idle' }
            ];
            
            container.innerHTML = agents.map(agent => `
                <div class="activity-item">
                    <div class="activity-icon icon-${agent.role}">${agent.emoji}</div>
                    <div class="activity-info">
                        <div class="activity-agent">${agent.name}</div>
                        <div class="activity-task">${agent.status === 'idle' ? 'Available' : 'Working...'}</div>
                    </div>
                    <div class="activity-bar">
                        <div class="activity-progress" style="width: ${agent.status === 'idle' ? 0 : 60}%"></div>
                    </div>
                </div>
            `).join('');
        }
        
        // Load live feed
        async function loadLiveFeed() {
            try {
                const response = await fetch(`${API_BASE}/live-feed?limit=10`);
                const data = await response.json();
                
                const container = document.getElementById('live-feed');
                
                if (data.feed && data.feed.length > 0) {
                    container.innerHTML = data.feed.map(item => `
                        <div class="feed-item">
                            <div class="feed-time">${item.time}</div>
                            <div class="feed-content">
                                <div class="feed-channel">${item.channel}</div>
                                <div class="feed-message">${escapeHtml(item.action)}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div style="color: var(--text-secondary); padding: 20px;">No recent activity</div>';
                }
                
            } catch (error) {
                console.error('Error loading live feed:', error);
            }
        }
        
        // Load channels
        async function loadChannels() {
            try {
                const response = await fetch(`${API_BASE}/channels`);
                const data = await response.json();
                
                const container = document.getElementById('channels-grid');
                
                if (data.channels && data.channels.length > 0) {
                    container.innerHTML = data.channels.slice(0, 8).map(ch => `
                        <div class="channel-card ${ch.name === currentChannel ? 'active' : ''}" 
                             onclick="switchChannel('${ch.name}')">
                            <div class="channel-name">${ch.name}</div>
                            <div class="channel-messages">${ch.message_count || 0}</div>
                            <div class="channel-preview">${ch.description || ''}</div>
                        </div>
                    `).join('');
                }
                
            } catch (error) {
                console.error('Error loading channels:', error);
            }
        }
        
        // Load messages
        async function loadMessages(channel) {
            try {
                const response = await fetch(`${API_BASE}/channels/${channel}/messages?limit=20`);
                const data = await response.json();
                
                const container = document.getElementById('messages-view');
                document.getElementById('current-channel').textContent = '#' + channel;
                
                if (data.messages && data.messages.length > 0) {
                    container.innerHTML = data.messages.map(msg => `
                        <div class="message-item">
                            <div class="message-avatar">${getAvatar(msg.author_id)}</div>
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="message-author">${escapeHtml(msg.author_id)}</span>
                                    <span class="message-time">${formatTime(msg.created_at)}</span>
                                </div>
                                <div class="message-text">${escapeHtml(msg.content)}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div style="color: var(--text-secondary); padding: 20px;">No messages yet</div>';
                }
                
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }
        
        // Switch channel
        function switchChannel(channel) {
            currentChannel = channel;
            loadChannels();
            loadMessages(channel);
        }
        
        // Create task
        async function createTask() {
            const input = document.getElementById('task-input');
            const task = input.value.trim();
            
            if (!task) return;
            
            const btn = document.querySelector('.btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            try {
                const response = await fetch(`${API_BASE}/coordinate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: task, auto_execute: true })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    alert(`Task ${data.task_code} created successfully!`);
                    loadDashboard();
                    loadLiveFeed();
                    loadMessages(currentChannel);
                } else {
                    alert('Error: ' + data.error);
                }
                
            } catch (error) {
                alert('Error creating task: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Executar';
            }
        }
        
        // Auto refresh
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                loadLiveFeed();
                loadMessages(currentChannel);
            }, 5000); // Refresh every 5 seconds
        }
        
        // Helpers
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function getAvatar(name) {
            const avatars = {
                'ralph': '🎩',
                'scout': '🔍',
                'max': '🛠️',
                'maya': '📝',
                'tracker': '📊',
                'watcher': '👁️',
                'Jeff': '👤'
            };
            return avatars[name] || '🤖';
        }
        
        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
