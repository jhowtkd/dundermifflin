<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dunder Mifflin - Arquivos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style type="text/tailwindcss">
        :root {
            --win-bg: #c0c0c0;
            --win-highlight: #ffffff;
            --win-shadow: #808080;
            --win-shadow-dark: #404040;
            --terminal-green: #00FF41;
        }
        @layer utilities {
            .win95-raised {
                box-shadow: inset 1.5px 1.5px 0px var(--win-highlight),
                            inset -1.5px -1.5px 0px var(--win-shadow),
                            1.5px 1.5px 0px var(--win-shadow-dark);
            }
            .win95-inset {
                box-shadow: inset 1.5px 1.5px 0px var(--win-shadow),
                            inset -1.5px -1.5px 0px var(--win-highlight);
                background-color: #dfdfdf;
            }
            .win95-button {
                @apply bg-[var(--win-bg)] border-none relative active:translate-y-[1px] active:translate-x-[1px];
                box-shadow: inset 1.5px 1.5px 0px var(--win-highlight),
                            inset -1.5px -1.5px 0px var(--win-shadow),
                            1px 1px 0px 1px #000;
            }
            .win95-card {
                @apply bg-[var(--win-bg)] p-1;
                box-shadow: inset 1.5px 1.5px 0px var(--win-highlight),
                            inset -1.5px -1.5px 0px var(--win-shadow),
                            3px 3px 0px 0px rgba(0,0,0,0.4);
            }
            .win95-window-title {
                background: linear-gradient(90deg, #000080, #1084d0);
            }
        }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00FF41",
                        "background-light": "#7ea2a2",
                        "background-dark": "#0D1117",
                    },
                    fontFamily: {
                        display: ['"Press Start 2P"', 'cursive'],
                        mono: ['"VT323"', 'monospace'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-mono text-lg min-h-screen text-gray-900 dark:text-gray-300 relative overflow-x-hidden selection:bg-primary selection:text-black">
    <div class="crt-overlay"></div>

    <!-- Header -->
    <header class="win95-raised bg-[var(--win-bg)] dark:bg-black p-1 sticky top-0 z-40 mb-4 mx-1">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4 py-1">
            <div class="flex items-center space-x-3">
                <a href="/" class="text-2xl select-none hover:opacity-80">🏢</a>
                <h1 class="font-display text-[10px] md:text-sm text-black dark:text-primary uppercase tracking-tighter">
                    Dunder Mifflin <span class="hidden sm:inline">- Arquivos</span>
                </h1>
            </div>
            <div id="api-status" class="flex items-center space-x-2 bg-black/10 px-2 py-1 win95-inset">
                <div class="w-3 h-3 bg-gray-500 border border-black/20"></div>
                <span class="text-[10px] font-display text-gray-600">CONNECTING...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6 relative z-10">
        <!-- Navigation -->
        <div class="flex flex-wrap gap-3 py-2 px-1 border-b-2 border-black/20">
            <a href="/" class="win95-button px-4 py-2 flex items-center space-x-2">
                <span class="material-symbols-outlined text-sm">home</span>
                <span class="font-display text-[9px]">Dashboard</span>
            </a>
            <a href="/proposals" class="win95-button px-4 py-2 flex items-center space-x-2">
                <span class="material-symbols-outlined text-sm">edit_note</span>
                <span class="font-display text-[9px]">Propostas</span>
            </a>
            <a href="/missions" class="win95-button px-4 py-2 flex items-center space-x-2">
                <span class="material-symbols-outlined text-sm">rocket_launch</span>
                <span class="font-display text-[9px]">Missões</span>
            </a>
            <a href="/files" class="win95-button px-4 py-2 flex items-center space-x-2 bg-blue-100">
                <span class="material-symbols-outlined text-sm text-blue-700">folder_open</span>
                <span class="font-display text-[9px] text-blue-900">Arquivos</span>
            </a>
            <a href="/agents" class="win95-button px-4 py-2 flex items-center space-x-2">
                <span class="material-symbols-outlined text-sm">smart_toy</span>
                <span class="font-display text-[9px]">Agentes</span>
            </a>
        </div>

        <!-- Files Window -->
        <section class="win95-card">
            <div class="win95-window-title flex justify-between items-center px-2 py-1">
                <div class="flex items-center space-x-2">
                    <span class="text-lg">📁</span>
                    <h2 class="font-display text-[10px] text-white tracking-widest">C:\FILES\GENERATED_FILES.EXE</h2>
                </div>
                <div class="flex space-x-1">
                    <button class="w-5 h-5 bg-[var(--win-bg)] win95-raised flex items-center justify-center text-xs font-bold">_</button>
                    <button class="w-5 h-5 bg-[var(--win-bg)] win95-raised flex items-center justify-center text-xs font-bold">□</button>
                    <a href="/" class="w-5 h-5 bg-[var(--win-bg)] win95-raised flex items-center justify-center text-xs font-bold">X</a>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="flex gap-1 p-1 bg-[var(--win-bg)]">
                <button onclick="loadFiles()" class="win95-button px-3 py-1 text-[10px] font-display flex items-center space-x-1">
                    <span class="material-symbols-outlined text-sm">refresh</span>
                    <span>REFRESH</span>
                </button>
            </div>

            <div class="bg-white dark:bg-black win95-inset m-1 p-4 min-h-[500px]">
                <div id="files-list">
                    <!-- Files will be rendered here -->
                    <div class="text-center py-8 font-mono text-gray-500">
                        Carregando arquivos...
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="bg-[var(--win-bg)] flex justify-between items-center text-[10px] font-display text-gray-700 p-1">
                <div class="win95-inset px-2 flex-1 mr-1 py-0.5" id="files-count">0 arquivos</div>
                <div class="win95-inset px-2 w-48 py-0.5 text-center">PATH: ~/.openclaw/...</div>
            </div>
        </section>

        <!-- Preview Modal -->
        <div id="preview-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="win95-card max-w-4xl max-h-[90vh] w-full overflow-hidden">
                <div class="win95-window-title flex justify-between items-center px-2 py-1">
                    <div class="flex items-center space-x-2">
                        <span class="text-lg">👁️</span>
                        <h2 class="font-display text-[10px] text-white tracking-widest" id="preview-title">PREVIEW</h2>
                    </div>
                    <button onclick="closePreview()" class="w-5 h-5 bg-[var(--win-bg)] win95-raised flex items-center justify-center text-xs font-bold">X</button>
                </div>
                <div class="bg-white win95-inset m-1 p-4 max-h-[70vh] overflow-auto">
                    <iframe id="preview-iframe" class="w-full h-[60vh] border-0"></iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script>
        let files = [];

        async function loadFiles() {
            try {
                const data = await API.files();
                files = data.files || [];
                renderFiles();
            } catch (e) {
                console.error('Error loading files:', e);
                document.getElementById('files-list').innerHTML = `
                    <div class="text-center py-8 font-mono text-red-500">
                        Erro ao carregar arquivos
                    </div>
                `;
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getFileIcon(name) {
            if (name.endsWith('.html')) return '🌐';
            if (name.endsWith('.json')) return '📋';
            if (name.endsWith('.md')) return '📝';
            if (name.endsWith('.png') || name.endsWith('.jpg')) return '🖼️';
            if (name.endsWith('.pdf')) return '📄';
            return '📁';
        }

        function renderFiles() {
            const container = document.getElementById('files-list');
            const countEl = document.getElementById('files-count');

            if (files.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 font-mono text-gray-500">
                        <div class="text-4xl mb-4">📂</div>
                        Nenhum arquivo gerado ainda.<br/>
                        <span class="text-sm">Execute uma missão para gerar arquivos.</span>
                    </div>
                `;
                countEl.textContent = '0 arquivos';
                return;
            }

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${files.map(file => `
                        <div class="win95-raised bg-[var(--win-bg)] p-3">
                            <div class="flex items-start space-x-3">
                                <div class="text-3xl">${getFileIcon(file.name)}</div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-display text-[10px] text-black truncate" title="${file.name}">${file.name}</h4>
                                    <div class="text-[11px] font-mono text-gray-600 mt-1">
                                        ${formatSize(file.size)} • ${new Date(file.modified).toLocaleDateString('pt-BR')}
                                    </div>
                                    <div class="bg-black text-primary p-1 text-[10px] font-mono mt-2 truncate" title="${file.path}">
                                        ${file.path}
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2 mt-3">
                                <button onclick="previewFile('${file.path}')" class="win95-button px-2 py-1 flex items-center space-x-1">
                                    <span class="material-symbols-outlined text-sm">visibility</span>
                                    <span class="font-display text-[8px]">VER</span>
                                </button>
                                <a href="/api/files/${file.path}" download class="win95-button px-2 py-1 flex items-center space-x-1">
                                    <span class="material-symbols-outlined text-sm">download</span>
                                    <span class="font-display text-[8px]">BAIXAR</span>
                                </a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            countEl.textContent = `${files.length} arquivos`;
        }

        function previewFile(path) {
            const modal = document.getElementById('preview-modal');
            const iframe = document.getElementById('preview-iframe');
            const title = document.getElementById('preview-title');

            title.textContent = path;
            iframe.src = `/api/files/${path}`;
            modal.classList.remove('hidden');
        }

        function closePreview() {
            const modal = document.getElementById('preview-modal');
            const iframe = document.getElementById('preview-iframe');

            modal.classList.add('hidden');
            iframe.src = '';
        }

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreview();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadFiles();

            // Check API status
            try {
                const health = await API.health();
                if (health.status === 'ok') {
                    document.getElementById('api-status').innerHTML = `
                        <div class="w-3 h-3 bg-primary animate-pulse border border-black/20"></div>
                        <span class="text-[10px] font-display text-green-700 dark:text-primary">API ONLINE</span>
                    `;
                }
            } catch (e) {}
        });

        // Dark mode
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
