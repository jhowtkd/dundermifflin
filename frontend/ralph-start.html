<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Ralph Loop - Dunder Mifflin</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-highlight: #ffffff;
            --win-shadow: #808080;
            --win-dark: #404040;
            --win-blue: #000080;
            --win-blue-light: #1084d0;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #008080;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .mono { font-family: 'VT323', monospace; font-size: 18px; }
        
        .window {
            background: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark) var(--win-dark) var(--win-highlight);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }
        
        .window-title {
            background: linear-gradient(90deg, var(--win-blue), var(--win-blue-light));
            color: white;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .window-title h1 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .window-controls {
            display: flex;
            gap: 4px;
        }
        
        .win-btn {
            width: 20px;
            height: 18px;
            background: var(--win-bg);
            border: 1px solid;
            border-color: var(--win-highlight) var(--win-dark) var(--win-dark) var(--win-highlight);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .win-btn:active {
            border-color: var(--win-dark) var(--win-highlight) var(--win-highlight) var(--win-dark);
        }
        
        .content {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #000;
        }
        
        .required::after {
            content: ' *';
            color: #c00;
        }
        
        select, textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid;
            border-color: var(--win-dark) var(--win-highlight) var(--win-highlight) var(--win-dark);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            background: #fff;
        }
        
        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: var(--win-blue);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .agent-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .agent-option {
            position: relative;
        }
        
        .agent-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }
        
        .agent-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark) var(--win-dark) var(--win-highlight);
            background: var(--win-bg);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .agent-option label:hover {
            background: #d4d4d4;
        }
        
        .agent-option input[type="radio"]:checked + label {
            border-color: var(--win-dark) var(--win-highlight) var(--win-highlight) var(--win-dark);
            background: #b0b0b0;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .agent-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .agent-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .agent-desc {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-dark) var(--win-dark) var(--win-highlight);
            background: var(--win-bg);
            color: #000;
        }
        
        .btn:active {
            border-color: var(--win-dark) var(--win-highlight) var(--win-highlight) var(--win-dark);
        }
        
        .btn-primary {
            background: linear-gradient(180deg, #4a90d9, #357abd);
            color: white;
            border-color: #6aa3e0 #2a5f8f #2a5f8f #6aa3e0;
        }
        
        .btn-primary:active {
            border-color: #2a5f8f #6aa3e0 #6aa3e0 #2a5f8f;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--win-shadow);
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: var(--win-bg);
            border-top: 1px solid var(--win-shadow);
            font-size: 12px;
            color: #333;
        }
        
        /* Resultado */
        .result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border: 1px solid var(--win-shadow);
        }
        
        .result.success {
            display: block;
            background: #e8f5e9;
            border-color: #4caf50;
        }
        
        .result.error {
            display: block;
            background: #ffebee;
            border-color: #f44336;
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .result-content {
            font-family: 'VT323', monospace;
            font-size: 16px;
        }
        
        .loop-code {
            background: #000;
            color: #0f0;
            padding: 4px 8px;
            font-family: 'VT323', monospace;
            font-size: 18px;
        }
        
        /* Loading */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }
        
        .loading.active {
            display: flex;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--win-shadow);
            border-top-color: var(--win-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Presets */
        .presets {
            margin-bottom: 20px;
        }
        
        .preset-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .preset-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid var(--win-shadow);
            background: #fff;
            cursor: pointer;
        }
        
        .preset-btn:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <!-- Suprimir erros de extensões do Chrome -->
    <script>
        window.addEventListener('error', function(e) {
            if (e && e.message && e.message.includes('message channel closed')) {
                e.preventDefault();
                return false;
            }
        });
        window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && e.reason.message && e.reason.message.includes('message channel closed')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
    
    <div class="window">
        <div class="window-title">
            <h1>🔄 Iniciar Ralph Loop</h1>
            <div class="window-controls">
                <button class="win-btn" onclick="window.location.href='index.html'">×</button>
            </div>
        </div>
        
        <div class="content">
            <form id="ralphForm">
                <!-- Seleção de Agente -->
                <div class="form-group">
                    <label class="required">Selecione o Agente</label>
                    <div class="agent-options">
                        <div class="agent-option">
                            <input type="radio" name="agent" id="agent-dev" value="dev" checked>
                            <label for="agent-dev">
                                <span class="agent-icon">👨‍💻</span>
                                <span class="agent-name">O Dev</span>
                                <span class="agent-desc">Código & Tecnologia</span>
                            </label>
                        </div>
                        <div class="agent-option">
                            <input type="radio" name="agent" id="agent-mkt" value="marketeiro">
                            <label for="agent-mkt">
                                <span class="agent-icon">📢</span>
                                <span class="agent-name">O Marketeiro</span>
                                <span class="agent-desc">Copy & Criativos</span>
                            </label>
                        </div>
                        <div class="agent-option">
                            <input type="radio" name="agent" id="agent-exec" value="executivo">
                            <label for="agent-exec">
                                <span class="agent-icon">💼</span>
                                <span class="agent-name">O Executivo</span>
                                <span class="agent-desc">Gestão & Análise</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Presets -->
                <div class="presets">
                    <div class="preset-label">💡 Tarefas comuns (clique para preencher):</div>
                    <div class="preset-buttons" id="presets">
                        <!-- Preenchido via JS baseado no agente -->
                    </div>
                </div>
                
                <!-- Descrição da Tarefa -->
                <div class="form-group">
                    <label for="task" class="required">Descrição da Tarefa</label>
                    <textarea id="task" name="task" placeholder="Descreva o que você precisa que o agente faça...&#10;&#10;Ex: Criar uma função em Python para validar CPF, seguindo TDD"></textarea>
                </div>
                
                <!-- Opções Avançadas -->
                <div class="form-group">
                    <label>Opções Avançadas</label>
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <div>
                            <label style="font-size: 12px; color: #666;">Máximo de Iterações:</label>
                            <input type="number" id="maxIterations" name="max_iterations" value="20" min="1" max="100" style="width: 80px;">
                        </div>
                        <div style="font-size: 12px; color: #666;">
                            💰 Custo estimado: ~$0.10 (20 iterações)
                        </div>
                    </div>
                </div>
                
                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>Iniciando Ralph Loop...</span>
                </div>
                
                <!-- Resultado -->
                <div class="result" id="result">
                    <div class="result-title"></div>
                    <div class="result-content"></div>
                </div>
                
                <!-- Ações -->
                <div class="form-actions">
                    <button type="button" class="btn" onclick="window.location.href='ralph-dashboard.html'">
                        📊 Dashboard
                    </button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        🚀 Iniciar Loop
                    </button>
                </div>
            </form>
        </div>
        
        <div class="status-bar">
            <span>Ralph Loop v1.0</span>
            <span>🔄 Iteração > Perfeição</span>
        </div>
    </div>
    
    <script>
        // Presets por agente
        const presets = {
            dev: [
                "Criar API REST com autenticação JWT",
                "Implementar função de validação de CPF/CNPJ",
                "Refatorar módulo seguindo TDD",
                "Criar script de automação para deploy",
                "Implementar testes unitários para função X"
            ],
            marketeiro: [
                "Escrever 5 variações de headline para anúncio",
                "Criar copy para email marketing de vendas",
                "Desenvolver roteiro para vídeo de 60 segundos",
                "Escrever post para LinkedIn sobre tendências",
                "Criar proposta comercial para prospect"
            ],
            executivo: [
                "Analisar métricas de conversão do último mês",
                "Criar relatório de ROI das campanhas ativas",
                "Priorizar backlog de tarefas por impacto",
                "Analisar custos e sugerir otimizações",
                "Criar apresentação para stakeholders"
            ]
        };
        
        // Atualizar presets quando mudar agente
        document.querySelectorAll('input[name="agent"]').forEach(radio => {
            radio.addEventListener('change', updatePresets);
        });
        
        function updatePresets() {
            const agent = document.querySelector('input[name="agent"]:checked').value;
            const container = document.getElementById('presets');
            
            container.innerHTML = presets[agent].map(preset => 
                `<button type="button" class="preset-btn" onclick="setTask('${preset.replace(/'/g, "\\'")}')">${preset}</button>`
            ).join('');
        }
        
        function setTask(text) {
            document.getElementById('task').value = text;
        }
        
        // Atualizar custo estimado
        document.getElementById('maxIterations').addEventListener('input', function() {
            const iterations = parseInt(this.value) || 20;
            const cost = (iterations * 0.005).toFixed(2);
            this.parentElement.nextElementSibling.textContent = `💰 Custo estimado: ~$${cost} (${iterations} iterações)`;
        });
        
        // Submit do formulário
        document.getElementById('ralphForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const agent = document.querySelector('input[name="agent"]:checked').value;
            const task = document.getElementById('task').value.trim();
            const maxIterations = parseInt(document.getElementById('maxIterations').value) || 20;
            
            if (!task) {
                showResult('error', 'Erro', 'Por favor, descreva a tarefa.');
                return;
            }
            
            // Mostrar loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('result').className = 'result';
            
            try {
                const response = await fetch('http://clawd-b450mhp:3003/api/ralph/loop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        agent: agent,
                        task: task,
                        max_iterations: maxIterations
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult('success', '✅ Loop Iniciado!', `
                        Código: <span class="loop-code">${data.loop_code}</span><br>
                        Agente: ${data.agent}<br>
                        Status: ${data.status}<br><br>
                        <a href="${data.dashboard_url}" target="_blank">📊 Ver no Dashboard</a>
                    `);
                    
                    // Limpar formulário
                    document.getElementById('task').value = '';
                } else {
                    showResult('error', '❌ Erro', data.error || 'Falha ao iniciar loop');
                }
                
            } catch (err) {
                showResult('error', '❌ Erro', 'Não foi possível conectar à API. Verifique se o servidor está rodando.');
            }
            
            document.getElementById('loading').classList.remove('active');
            document.getElementById('submitBtn').disabled = false;
        });
        
        function showResult(type, title, content) {
            const result = document.getElementById('result');
            result.className = 'result ' + type;
            result.querySelector('.result-title').textContent = title;
            result.querySelector('.result-content').innerHTML = content;
        }
        
        // Inicializar
        updatePresets();
    </script>
</body>
</html>
