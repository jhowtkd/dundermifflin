<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dunder Mifflin - Agentes Ativos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style type="text/tailwindcss">
        :root {
            --win-bg: #c0c0c0;
            --win-highlight-light: #ffffff;
            --win-highlight-dark: #dfdfdf;
            --win-shadow-light: #808080;
            --win-shadow-dark: #404040;
            --win-shadow-black: #000000;
            --terminal-green: #00FF41;
            --terminal-bg: #0D1117;
        }
        @layer utilities {
            .win95-raised-deep {
                box-shadow: inset 1px 1px 0px var(--win-highlight-light),
                            inset -1px -1px 0px var(--win-shadow-dark),
                            inset 2px 2px 0px var(--win-highlight-dark),
                            inset -2px -2px 0px var(--win-shadow-light),
                            2px 2px 0px 0px var(--win-shadow-black);
            }
            .win95-raised {
                box-shadow: inset 1px 1px 0px var(--win-highlight-light),
                            inset -1px -1px 0px var(--win-shadow-dark),
                            1px 1px 0px 0px var(--win-shadow-black);
            }
            .win95-inset-deep {
                box-shadow: inset 1px 1px 0px var(--win-shadow-dark),
                            inset -1px -1px 0px var(--win-highlight-light),
                            inset 2px 2px 0px var(--win-shadow-light),
                            inset -2px -2px 0px var(--win-highlight-dark);
                background-color: #fff;
            }
            .win95-inset-panel {
                box-shadow: inset 1px 1px 0px var(--win-shadow-dark),
                            inset -1px -1px 0px var(--win-highlight-light);
                background-color: #dfdfdf;
            }
            .win95-button-prominent {
                @apply bg-[var(--win-bg)] border-none relative active:translate-y-[1px] active:translate-x-[1px] flex items-center justify-center;
                box-shadow: inset 1px 1px 0px var(--win-highlight-light),
                            inset -1px -1px 0px var(--win-shadow-dark),
                            inset -2px -2px 0px var(--win-shadow-light),
                            1px 1px 0px 0px var(--win-shadow-black);
            }
            .win95-button-prominent:active {
                box-shadow: inset 1px 1px 0px var(--win-shadow-dark),
                            inset -1px -1px 0px var(--win-highlight-light);
            }
            .win95-window-title {
                background: linear-gradient(90deg, #000080, #1084d0);
            }
            .pixel-avatar {
                image-rendering: pixelated;
            }
        }
        ::-webkit-scrollbar {
            width: 16px;
            background: var(--win-bg);
            box-shadow: inset 1px 1px 0px var(--win-highlight-light);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--win-bg);
            box-shadow: inset 1px 1px 0px var(--win-highlight-light),
                        inset -1px -1px 0px var(--win-shadow-dark),
                        inset -2px -2px 0px var(--win-shadow-light);
        }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
        }
        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00FF41",
                        "background-light": "#7ea2a2",
                        "background-dark": "#0D1117",
                        "win-gray": "#c0c0c0",
                    },
                    fontFamily: {
                        display: ['"Press Start 2P"', 'cursive'],
                        mono: ['"VT323"', 'monospace'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-mono text-lg min-h-screen text-gray-900 dark:text-gray-300 relative overflow-x-hidden selection:bg-primary selection:text-black">
    <div class="crt-overlay"></div>

    <!-- Header -->
    <header class="win95-raised-deep bg-[var(--win-bg)] p-1 sticky top-0 z-40 mb-4 mx-1 mt-1">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-2 py-1">
            <div class="flex items-center space-x-3">
                <a href="/index.html" class="win95-button-prominent w-8 h-8 p-1">
                    <span class="text-xl select-none">🏢</span>
                </a>
                <h1 class="font-display text-[10px] md:text-sm text-black uppercase tracking-tighter">
                    Dunder Mifflin <span class="hidden sm:inline">- Agentes Jules</span>
                </h1>
            </div>
            <div id="api-status" class="flex items-center space-x-2 bg-black px-2 py-1 win95-inset-deep">
                <div class="w-2 h-2 bg-gray-500"></div>
                <span class="text-[12px] font-mono text-gray-500">CONNECTING...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-2 md:p-4 space-y-6 relative z-10">
        <!-- Main Window -->
        <section class="win95-raised-deep bg-[var(--win-bg)] p-1">
            <!-- Title Bar -->
            <div class="win95-window-title flex justify-between items-center px-2 py-1 mb-1">
                <div class="flex items-center space-x-2">
                    <span class="text-lg">👥</span>
                    <h2 class="font-display text-[10px] text-white tracking-widest uppercase">C:\AGENTS\JULES_AGENTS.SYS</h2>
                </div>
                <div class="flex space-x-1">
                    <button class="w-5 h-5 win95-button-prominent text-black text-xs font-bold leading-none pb-1">_</button>
                    <button class="w-5 h-5 win95-button-prominent text-black text-xs font-bold leading-none">□</button>
                    <a href="/index.html" class="w-5 h-5 win95-button-prominent text-black text-xs font-bold leading-none flex items-center justify-center">X</a>
                </div>
            </div>

            <!-- Menu Bar -->
            <div class="flex gap-1 mb-2 px-1">
                <div class="text-[12px] font-display text-black mr-4 py-1">File</div>
                <div class="text-[12px] font-display text-black mr-4 py-1">Edit</div>
                <div class="text-[12px] font-display text-black mr-4 py-1">View</div>
                <div class="text-[12px] font-display text-black mr-4 py-1">Help</div>
            </div>

            <!-- Toolbar -->
            <div class="win95-inset-panel mb-2 p-1 flex gap-2 flex-wrap">
                <button onclick="loadAgents()" class="win95-button-prominent px-3 py-1 flex items-center space-x-2">
                    <span class="material-symbols-outlined text-sm">refresh</span>
                    <span class="font-display text-[8px] text-black">REFRESH</span>
                </button>
                <button onclick="clearDepartmentFilter()" class="win95-button-prominent px-3 py-1 flex items-center space-x-2">
                    <span class="material-symbols-outlined text-sm">filter_alt_off</span>
                    <span class="font-display text-[8px] text-black">TODOS</span>
                </button>
                <a href="/proposals.html" class="win95-button-prominent px-3 py-1 flex items-center space-x-2">
                    <span class="material-symbols-outlined text-sm">add</span>
                    <span class="font-display text-[8px] text-black">NOVA MISSÃO</span>
                </a>
            </div>

            <!-- Main Content -->
            <div class="flex flex-col lg:flex-row gap-2 h-auto lg:h-[600px]">
                <!-- Sidebar: Departments -->
                <div class="w-full lg:w-48 shrink-0">
                    <div class="win95-inset-deep bg-white p-2 h-full overflow-y-auto">
                        <div class="font-display text-[8px] text-gray-600 mb-2 uppercase">Departamentos</div>
                        <div id="departments-list" class="space-y-1">
                            <!-- Departments will be rendered here -->
                            <div class="text-center py-4 text-gray-500 font-mono text-sm">
                                Carregando...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Agents Grid -->
                <div class="win95-inset-deep bg-white flex-1 p-4 overflow-y-auto">
                    <div id="agents-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                        <!-- Agents will be rendered here -->
                        <div class="col-span-full text-center py-8 text-gray-500 font-mono">
                            Carregando agentes...
                        </div>
                    </div>
                </div>

                <!-- Agent Details Terminal -->
                <div class="w-full lg:w-80 shrink-0 flex flex-col gap-2">
                    <div id="agent-terminal" class="win95-inset-deep bg-black p-4 flex-1 font-mono text-sm leading-snug overflow-y-auto border-4 border-[var(--win-bg)]">
                        <div class="text-primary mb-4 animate-pulse">
                            &gt; AGUARDANDO SELEÇÃO...<br/>
                            &gt; SELECIONE UM AGENTE PARA VER DETALHES
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="win95-raised-deep bg-[var(--win-bg)] p-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button class="win95-button-prominent py-2 px-1 flex flex-col items-center">
                                <span class="material-symbols-outlined text-base mb-1">rocket_launch</span>
                                <span class="font-display text-[8px] text-center">MISSÃO</span>
                            </button>
                            <button class="win95-button-prominent py-2 px-1 flex flex-col items-center">
                                <span class="material-symbols-outlined text-base mb-1">description</span>
                                <span class="font-display text-[8px] text-center">VER .MD</span>
                            </button>
                            <button class="win95-button-prominent py-2 px-1 flex flex-col items-center col-span-2">
                                <span class="material-symbols-outlined text-base mb-1">visibility</span>
                                <span class="font-display text-[8px] text-center">PERFIL COMPLETO</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="mt-1 flex justify-between items-center text-[10px] font-display text-black px-1 pb-1">
                <div class="win95-inset-panel px-2 py-0.5 w-1/3 truncate" id="status-file">OBJ: Nenhum selecionado</div>
                <div class="win95-inset-panel px-2 py-0.5 w-32 text-center">52 AGENTES</div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // Initialize on load
        document.addEventListener('DOMContentLoaded', initAgentsPage);

        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
