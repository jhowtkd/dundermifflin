<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentes - Dunder Mifflin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }
        
        .stat-card .label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #eee;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .filter-btn:hover {
            background: rgba(233,69,96,0.3);
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            background: #e94560;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .agent-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .agent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: rgba(233,69,96,0.3);
        }
        
        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .agent-card:hover::before {
            opacity: 1;
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .agent-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(233,69,96,0.2);
            border-radius: 12px;
        }
        
        .agent-title {
            flex: 1;
        }
        
        .agent-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .agent-tag {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(233,69,96,0.2);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #e94560;
            font-family: monospace;
        }
        
        .agent-department {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 12px;
        }
        
        .agent-description {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .agent-example {
            background: rgba(0,0,0,0.2);
            border-left: 3px solid #e94560;
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.4;
        }
        
        .agent-example strong {
            color: #e94560;
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #aaa;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e94560;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(233,69,96,0.8);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #e94560;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <a href="services.html" class="back-link">← Voltar ao Dashboard</a>
    
    <div class="header">
        <h1>🤖 Catálogo de Agentes</h1>
        <p>50 agentes especializados prontos para trabalhar</p>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="number" id="totalAgents">-</div>
            <div class="label">Total de Agentes</div>
        </div>
        <div class="stat-card">
            <div class="number" id="totalDepts">-</div>
            <div class="label">Departamentos</div>
        </div>
    </div>
    
    <div class="filters" id="filters">
        <button class="filter-btn active" data-dept="all">Todos</button>
    </div>
    
    <div class="agents-grid" id="agentsGrid">
        <div class="loading">Carregando agentes...</div>
    </div>
    
    <script>
        let agentsData = [];
        let departments = {};
        
        async function loadAgents() {
            try {
                // Carrega o catálogo JSON
                const response = await fetch('docs/agents_catalog.json');
                const data = await response.json();
                
                agentsData = data.agents;
                departments = data.departments;
                
                // Atualiza estatísticas
                document.getElementById('totalAgents').textContent = agentsData.length;
                document.getElementById('totalDepts').textContent = Object.keys(departments).length;
                
                // Cria filtros
                createFilters();
                
                // Renderiza agentes
                renderAgents(agentsData);
                
            } catch (error) {
                console.error('Erro ao carregar agentes:', error);
                document.getElementById('agentsGrid').innerHTML = 
                    '<div style="text-align:center;padding:50px;color:#e94560">Erro ao carregar agentes. Verifique o console.</div>';
            }
        }
        
        function createFilters() {
            const filtersContainer = document.getElementById('filters');
            
            Object.entries(departments).forEach(([key, dept]) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.dept = key;
                btn.innerHTML = `${dept.icon} ${dept.name}`;
                btn.onclick = () => filterAgents(key, btn);
                filtersContainer.appendChild(btn);
            });
        }
        
        function filterAgents(dept, btn) {
            // Atualiza botões ativos
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Filtra agentes
            const filtered = dept === 'all' 
                ? agentsData 
                : agentsData.filter(a => a.department === dept);
            
            renderAgents(filtered);
        }
        
        function renderAgents(agents) {
            const grid = document.getElementById('agentsGrid');
            
            if (agents.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:50px;color:#aaa">Nenhum agente encontrado.</div>';
                return;
            }
            
            grid.innerHTML = agents.map(agent => {
                const dept = agent.department_info || departments[agent.department] || {};
                const icon = dept.icon || '🤖';
                
                // Extrai emoji do nome se existir
                const nameParts = agent.name.match(/^(.+?)\s*([🔍🧪🔬💻🎨📦📢🤖⚡🛡️🧹🔄🚀♿🌍🖼️✨📝🛡️📖✨🗄️🔌📱📊🔗🧭⚙️🔧🧪🎭🔥📈📧🤝📋⚠️🚀🔀🐙🎬🎪🔍📊🎮💬🎥📸🎨🐦💼📖🔗🔮🔍🗃️🐚🔀📋🐍🎭📊🔧🔄])?$/);
                const cleanName = nameParts ? nameParts[1] : agent.name;
                const nameEmoji = nameParts && nameParts[2] ? nameParts[2] : '';
                
                return `
                    <div class="agent-card" data-dept="${agent.department}">
                        <div class="agent-header">
                            <div class="agent-icon">${icon}</div>
                            <div class="agent-title">
                                <div class="agent-name">${cleanName} ${nameEmoji}</div>
                                <span class="agent-tag">${agent.slug}</span>
                            </div>
                        </div>
                        
                        <div class="agent-department">
                            ${icon} ${dept.name || agent.department}
                        </div>
                        
                        <div class="agent-description">
                            ${agent.description}
                        </div>
                        
                        <div class="agent-example">
                            <strong>📝 Exemplo Prático</strong>
                            ${agent.example}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Setup evento do filtro "Todos"
        document.querySelector('[data-dept="all"]').onclick = function() {
            filterAgents('all', this);
        };
        
        // Carrega dados ao iniciar
        loadAgents();
    </script>
</body>
</html>
